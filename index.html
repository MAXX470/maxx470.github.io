<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JALWA V5 - CALCULATION ENGINE</title>
    <style>
        :root {
            --neon: #00ff88;
            --gold: #ffcc00;
            --bg: #050505;
        }
        body { background: var(--bg); color: #fff; font-family: 'Courier New', monospace; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        
        .terminal {
            width: 350px;
            background: #0a0a0a;
            border: 1px solid #333;
            border-top: 4px solid var(--neon);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 0 50px rgba(0, 255, 136, 0.1);
        }

        .header { display: flex; justify-content: space-between; font-size: 11px; margin-bottom: 20px; color: var(--neon); }
        
        .period-card { background: #111; padding: 10px; border-radius: 8px; text-align: center; border: 1px solid #222; }
        .p-label { font-size: 10px; color: #666; letter-spacing: 2px; }
        .p-id { font-size: 18px; color: var(--gold); font-weight: bold; margin-top: 5px; }

        .display { padding: 30px 0; text-align: center; }
        #t-num { font-size: 100px; font-weight: 900; line-height: 1; margin: 0; color: var(--neon); text-shadow: 0 0 20px rgba(0, 255, 136, 0.5); }
        #t-size { font-size: 20px; font-weight: bold; letter-spacing: 5px; margin-top: 10px; }

        .algo-box { font-size: 10px; color: #444; border-top: 1px solid #222; padding-top: 15px; margin-top: 15px; }
        .loading-bar { height: 2px; width: 0%; background: var(--neon); margin-top: 5px; transition: width 1s linear; }
    </style>
</head>
<body>

<div class="terminal">
    <div class="header">
        <span>● JALWA ELITE V5.2</span>
        <span id="timer">00:00</span>
    </div>

    <div class="period-card">
        <div class="p-label">TARGET PERIOD</div>
        <div class="p-id" id="display-period">LOADING...</div>
    </div>

    <div class="display">
        <div class="p-label">CALCULATED RESULT</div>
        <div id="t-num">--</div>
        <div id="t-size">WAITING</div>
    </div>

    <div class="algo-box">
        ALGO: <span style="color:#888">SUMMATION-DELTA-V7</span><br>
        STATUS: <span style="color:var(--neon)" id="status">CONNECTING TO SERVER...</span>
        <div class="loading-bar" id="l-bar"></div>
    </div>
</div>

<script>
// Real-time API for Wingo 30s/1m Data
const API_URL = "https://draw.ar-lottery01.com/WinGo/WinGo_30S/GetHistoryIssuePage.json";

async function fetchAndCalculate() {
    const status = document.getElementById('status');
    const lBar = document.getElementById('l-bar');
    
    status.innerText = "EXTRACTING DATA...";
    lBar.style.width = "40%";

    try {
        const response = await fetch(API_URL);
        const json = await response.json();
        const list = json.data.list;
        
        // 1. Get current Period and set Target (Current + 1)
        const currentPeriod = BigInt(list[0].issueNumber);
        document.getElementById('display-period').innerText = (currentPeriod + 1n).toString();

        // 2. MATHEMATICAL CALCULATION (Weighted Delta)
        // We take the last 3 winning numbers
        const n1 = parseInt(list[0].number);
        const n2 = parseInt(list[1].number);
        const n3 = parseInt(list[2].number);

        // Calculation: (Last*3 + Prev*2 + PrevPrev) Modulo 10
        // This creates a fixed mathematical "Gravity" for the next number
        let calculatedNum = ((n1 * 3) + (n2 * 2) + n3) % 10;
        
        // 3. UI Update
        setTimeout(() => {
            lBar.style.width = "100%";
            status.innerText = "CALCULATION SUCCESS";
            
            const numDisplay = document.getElementById('t-num');
            const sizeDisplay = document.getElementById('target-size');
            
            numDisplay.innerText = calculatedNum;
            const isBig = calculatedNum >= 5;
            sizeDisplay.innerText = isBig ? "BIG" : "SMALL";
            sizeDisplay.style.color = isBig ? "#00ff88" : "#ff3e3e";
            numDisplay.style.color = (calculatedNum % 2 === 0) ? "#ff3e3e" : "#00ff88";
            if(calculatedNum === 0 || calculatedNum === 5) numDisplay.style.color = "#b15eff"; // Violet
        }, 800);

    } catch (e) {
        status.innerText = "RETRYING CONNECTION...";
        lBar.style.width = "0%";
    }
}

// Sync with global timer
function updateTimer() {
    const now = new Date();
    const seconds = now.getSeconds();
    const remaining = 30 - (seconds % 30);
    document.getElementById('timer').innerText = `00:${remaining.toString().padStart(2, '0')}`;
    
    // Refresh calculation every time a new period starts
    if (remaining === 29) {
        document.getElementById('l-bar').style.width = "0%";
        fetchAndCalculate();
    }
}

// Initial Run
fetchAndCalculate();
setInterval(updateTimer, 1000);
</script>

</body>
</html>
