<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QUANTUM MATH ENGINE v3.0</title>
    <style>
        :root {
            --primary: #00f2ff;
            --bg: #050505;
            --surface: #0a0a15;
            --accent: #8b5cf6;
            --danger: #ff3e3e;
            --success: #10b981;
        }

        body {
            background-color: var(--bg);
            color: #e2e8f0;
            font-family: 'Courier New', monospace;
            margin: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        #game-frame {
            flex: 1;
            width: 100%;
            border: none;
            border-bottom: 2px solid var(--accent);
        }

        .math-panel {
            background: var(--surface);
            padding: 15px;
            border-radius: 25px 25px 0 0;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.8);
            border-top: 1px solid var(--accent);
        }

        .header-stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .timer-box {
            background: rgba(0,242,255,0.1);
            padding: 5px 15px;
            border-radius: 8px;
            border: 1px solid var(--primary);
        }

        #timer {
            font-size: 22px;
            font-weight: bold;
            color: var(--primary);
        }

        .prediction-box {
            background: rgba(0,0,0,0.6);
            border: 1px solid #333;
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            position: relative;
        }

        #result {
            font-size: 50px;
            font-weight: 900;
            margin: 5px 0;
            letter-spacing: 5px;
            text-shadow: 0 0 20px currentColor;
        }

        /* NEW: Stability Meter */
        .stability-container {
            width: 100%;
            height: 4px;
            background: #222;
            border-radius: 2px;
            margin: 10px 0;
        }
        #stability-bar {
            width: 0%;
            height: 100%;
            background: var(--accent);
            transition: width 1s ease-in-out;
            box-shadow: 0 0 10px var(--accent);
        }

        .math-metrics {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .metric-card {
            background: #0f172a;
            padding: 8px;
            border-radius: 8px;
            font-size: 11px;
            border: 1px solid #1e293b;
        }

        .terminal-log {
            height: 60px;
            background: #000;
            margin-top: 10px;
            padding: 5px;
            font-size: 9px;
            color: var(--success);
            overflow-y: hidden;
            border-radius: 5px;
            border: 1px solid #222;
        }

        .tab-btn {
            padding: 8px 15px;
            background: #1e1e26;
            border: 1px solid #333;
            color: #94a3b8;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
        }

        .tab-btn.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }
    </style>
</head>
<body>

<iframe src="https://jalwagame.com" id="game-frame"></iframe>

<div class="math-panel">
    <div class="header-stats">
        <div style="display:flex; gap:5px;">
            <button class="tab-btn active" onclick="setMode(30)">30S</button>
            <button class="tab-btn" onclick="setMode(60)">1M</button>
        </div>
        <div class="timer-box">
            <span id="timer">00:00</span>
        </div>
    </div>

    <div class="prediction-box">
        <div style="font-size: 10px; color: var(--accent);">PROBABILITY ANALYSIS</div>
        <div id="result" style="color: var(--primary);">SYNCING...</div>
        
        <div class="stability-container">
            <div id="stability-bar"></div>
        </div>

        <div class="math-metrics">
            <div class="metric-card">
                <div style="color:#64748b">CONFIDENCE</div>
                <div id="prob-val">0.00%</div>
            </div>
            <div class="metric-card">
                <div style="color:#64748b">HASH_SEED</div>
                <div id="seed-val">0xNULL</div>
            </div>
        </div>
    </div>

    <div class="terminal-log" id="term-log">
        > Initializing Quantum Modules...<br>
        > Listening for Server Entropy...
    </div>
</div>

<script>
    let currentMode = 30;
    const resultText = document.getElementById('result');
    const timerText = document.getElementById('timer');
    const probText = document.getElementById('prob-val');
    const seedText = document.getElementById('seed-val');
    const stabilityBar = document.getElementById('stability-bar');
    const termLog = document.getElementById('term-log');

    function addLog(msg) {
        const line = document.createElement('div');
        line.innerHTML = `> ${msg}`;
        termLog.prepend(line);
    }

    function calculatePrediction() {
        const now = new Date();
        const ts = now.getTime();
        
        // Multi-Layered Math for High Accuracy Illusion
        const seed1 = Math.sin(ts) * 10000;
        const hash = Math.floor(Math.abs(seed1 * 1664525) % 1000000);
        const weight = (hash % 1000) / 10;
        
        const isBig = weight > 50.0;
        const confidence = 70 + (Math.random() * 29); // Visual confidence 70-99%

        // UI Updates
        resultText.innerText = isBig ? "BIG" : "SMALL";
        resultText.style.color = isBig ? "#00f2ff" : "#ff3e3e";
        probText.innerText = confidence.toFixed(2) + "%";
        seedText.innerText = "0x" + hash.toString(16).toUpperCase();
        stabilityBar.style.width = confidence + "%";

        addLog(`Analysis Complete: ${isBig ? 'BIG' : 'SMALL'} (W:${weight})`);
        addLog(`Quantum Seed: 0x${hash.toString(16)}`);
    }

    function updateTimer() {
        const now = new Date();
        const elapsed = (now.getMinutes() * 60) + now.getSeconds();
        let remaining = currentMode - (elapsed % currentMode);

        let m = Math.floor(remaining / 60);
        let s = remaining % 60;
        timerText.innerText = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;

        if (remaining === currentMode) {
            calculatePrediction();
        }
        
        if (remaining <= 3) {
            resultText.innerText = "ANALYZING...";
            resultText.style.opacity = "0.5";
        } else {
            resultText.style.opacity = "1";
        }
    }

    function setMode(s) {
        currentMode = s;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        event.target.classList.add('active');
        addLog(`Switched to ${s}s Interval`);
        calculatePrediction();
    }

    setInterval(updateTimer, 1000);
    window.onload = () => {
        addLog("System Online. Kernel v3.0");
        calculatePrediction();
    };
</script>

</body>
</html>
