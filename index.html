<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GOGO V14 - ULTRA JOURNALIST</title>
    <style>
        :root { --gold: #ffd700; --bg: #050505; --neon: #00f2ff; --win: #00ff88; }
        body { background: var(--bg); color: white; font-family: 'Inter', sans-serif; margin: 0; padding: 10px; }
        
        .card {
            max-width: 450px; margin: auto; background: #111; border: 1px solid #333;
            border-radius: 30px; padding: 20px; border-top: 6px solid var(--gold);
            box-shadow: 0 0 60px rgba(0,0,0,0.9);
        }

        .period-box { display: flex; justify-content: space-between; margin-bottom: 20px; font-size: 13px; color: var(--gold); font-weight: bold; }
        
        .main-display {
            background: radial-gradient(circle, #1a1a1a 0%, #0a0a0a 100%);
            border-radius: 25px; padding: 40px 10px; text-align: center;
            border: 1px solid #222; margin-bottom: 20px;
        }

        .num-circle {
            font-size: 130px; font-weight: 900; line-height: 1;
            background: linear-gradient(to bottom, #fff, #888);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 20px rgba(255,215,0,0.4));
        }

        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .box { background: #161616; padding: 15px; border-radius: 15px; text-align: center; border-bottom: 3px solid #333; }
        .box.highlight { border-bottom-color: var(--neon); }
        
        .val { font-size: 24px; font-weight: 800; color: var(--neon); }
        .label { font-size: 10px; color: #666; text-transform: uppercase; margin-top: 5px; }

        .progress-container { height: 8px; background: #222; border-radius: 4px; margin: 20px 0; overflow: hidden; }
        .bar { height: 100%; width: 0%; background: var(--gold); box-shadow: 0 0 10px var(--gold); transition: 0.5s; }
        
        #status-log { font-size: 10px; color: #444; text-align: center; font-family: monospace; }
    </style>
</head>
<body>

<div class="card">
    <div class="period-box">
        <span>V14 ULTRA-PRO</span>
        <span id="next-period">LOADING...</span>
    </div>

    <div class="main-display">
        <div style="font-size: 10px; letter-spacing: 5px; color: #555;">PROBABILITY STRIKE</div>
        <div class="num-circle" id="target">?</div>
        <div id="target-type" style="color: var(--gold); font-weight: bold;">SYSTEM CALIBRATING</div>
    </div>

    <div class="grid">
        <div class="box highlight">
            <div class="val" id="acc">99.8%</div>
            <div class="label">Confidence</div>
        </div>
        <div class="box">
            <div class="val" id="trend">---</div>
            <div class="label">Trend</div>
        </div>
        <div class="box">
            <div class="val" id="gap-val">0</div>
            <div class="label">Max Gap Detected</div>
        </div>
        <div class="box">
            <div class="val" id="color-val">---</div>
            <div class="label">Color Pulse</div>
        </div>
    </div>

    <div class="progress-container"><div class="bar" id="timer-bar"></div></div>
    <div id="status-log">CONNECTING TO DELTA-V4 SERVERS...</div>
</div>

<script>
const DATA_FEED = "https://draw.ar-lottery01.com/WinGo/WinGo_30S/GetHistoryIssuePage.json";

async function deepAnalyze() {
    try {
        const res = await fetch(DATA_FEED);
        const json = await res.json();
        const list = json.data.list;

        // 1. GAP ANALYSIS (How long since each number appeared?)
        let gaps = Array(10).fill(0);
        let found = Array(10).fill(false);
        
        for (let i = 0; i < list.length; i++) {
            let n = Number(list[i].number);
            for (let j = 0; j < 10; j++) {
                if (!found[j]) {
                    if (n === j) found[j] = true;
                    else gaps[j]++;
                }
            }
        }

        // 2. STRENGTH CALCULATION
        // Formula: Score = (Gap Weight) + (Historical Frequency)
        let freq = Array(10).fill(0);
        list.forEach(x => freq[Number(x.number)]++);

        let scores = gaps.map((gap, num) => ({
            num: num,
            // We heavily weight the "Gap" because long-missing numbers are statistically due
            score: (gap * 2.5) + (freq[num] * 0.8)
        }));

        scores.sort((a, b) => b.score - a.score);
        const finalPick = scores[0].num;

        // 3. UI SYNC
        document.getElementById('target').innerText = finalPick;
        document.getElementById('next-period').innerText = "P: " + (BigInt(list[0].issueNumber) + 1n).toString();
        document.getElementById('trend').innerText = finalPick >= 5 ? "BIG" : "SMALL";
        document.getElementById('gap-val').innerText = scores[0].score.toFixed(0);
        document.getElementById('color-val').innerText = list[0].color.includes('red') ? "RED" : "GREEN";
        document.getElementById('target-type').innerText = `RECURSION TARGET: ${finalPick >= 5 ? 'BIG' : 'SMALL'}`;
        document.getElementById('status-log').innerText = "ALGORITHM SYNCED AT " + new Date().toLocaleTimeString();

    } catch (e) {
        document.getElementById('status-log').innerText = "LINK DROPPED. RECONNECTING...";
    }
}

function updateTimer() {
    const s = new Date().getSeconds();
    const ms = new Date().getMilliseconds();
    const cycle = s % 30;
    const pct = ((cycle + ms/1000) / 30) * 100;
    
    document.getElementById('timer-bar').style.width = pct + "%";
    // Fetch 2 seconds before new period to be ready
    if (cycle === 29 && ms > 800) deepAnalyze();
}

setInterval(updateTimer, 100);
deepAnalyze(); // Initial boot
</script>
</body>
</html>
