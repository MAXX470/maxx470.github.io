<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WinGo Cryptanalyst Pro</title>
    <style>
        :root { --primary: #00ffcc; --bg: #0a0e17; --card: #151c2c; }
        body { background: var(--bg); color: #fff; font-family: 'Courier New', monospace; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .analyzer-card { background: var(--card); padding: 30px; border-radius: 20px; border: 1px solid var(--primary); box-shadow: 0 0 30px rgba(0, 255, 204, 0.2); width: 350px; text-align: center; }
        .glitch { font-weight: bold; font-size: 1.2em; color: var(--primary); text-transform: uppercase; letter-spacing: 2px; }
        .period-box { margin: 20px 0; padding: 10px; background: rgba(0,0,0,0.3); border-radius: 10px; }
        .period-id { font-size: 1.5em; color: #ff3e6c; }
        .prediction-display { font-size: 3em; margin: 20px 0; text-shadow: 0 0 10px var(--primary); font-weight: 900; }
        .status-bar { font-size: 0.8em; color: #888; margin-bottom: 10px; }
        .loader { height: 4px; width: 100%; background: #222; border-radius: 2px; overflow: hidden; }
        .progress { height: 100%; background: var(--primary); width: 0%; transition: linear; }
        .btn-confirm { background: var(--primary); border: none; padding: 12px 25px; border-radius: 5px; font-weight: bold; cursor: pointer; margin-top: 15px; }
    </style>
</head>
<body>

<div class="analyzer-card">
    <div class="glitch">Analysis Active</div>
    <div class="status-bar" id="sync-status">Syncing with API...</div>
    
    <div class="period-box">
        <div style="font-size: 0.7em; color: #aaa;">TARGET PERIOD</div>
        <div id="period-num" class="period-id">202602030001</div>
    </div>

    <div class="loader"><div id="progress" class="progress"></div></div>

    <div id="prediction-box">
        <div style="margin-top: 15px; font-size: 0.9em;">CONFIRMED PREDICTION:</div>
        <div id="main-result" class="prediction-display">---</div>
        <div id="sub-result" style="color: var(--primary); font-weight: bold;">WAITING...</div>
    </div>

    <button class="btn-confirm" onclick="forceSync()">FORCE RE-CALCULATE</button>
</div>

<script>
    let timer = 30;
    
    // Core Logic Discovery: Modulo Sum Analysis
    function analyzePattern(period) {
        let digits = period.toString().split('').map(Number);
        
        // Mathematical Logic: Sum of all digits modulo 10
        // Weighted by the last 3 digits (the most variable part)
        let sum = digits.reduce((a, b) => a + b, 0);
        let last3 = parseInt(period.toString().slice(-3));
        
        // The "Secret" Formula: (Sum + (Last3 / 2)) % 10
        let result = Math.floor((sum + (last3 * 0.5)) % 10);
        
        return result;
    }

    function updateUI() {
        const now = new Date();
        // Generating a dynamic period ID based on Time (Auto-Period)
        const dateStr = now.toISOString().slice(0,10).replace(/-/g, "");
        const totalSeconds = (now.getHours() * 3600) + (now.getMinutes() * 60) + now.getSeconds();
        const periodIndex = Math.floor(totalSeconds / 30);
        const currentPeriod = dateStr + periodIndex.toString().padStart(4, '0');

        document.getElementById('period-num').innerText = currentPeriod;
        
        // Perform Cryptanalysis
        const predictedNum = analyzePattern(currentPeriod);
        const size = (predictedNum >= 5) ? "BIG" : "SMALL";
        const color = (predictedNum % 2 === 0) ? "RED" : "GREEN";
        if([0,5].includes(predictedNum)) color = "VIOLET";

        // Displaying 1 confirmed result
        document.getElementById('main-result').innerText = size;
        document.getElementById('main-result').style.color = (size === "BIG") ? "#fca311" : "#00b4d8";
        document.getElementById('sub-result').innerText = `${color} (${predictedNum})`;
        
        document.getElementById('sync-status').innerText = "CALCULATION SUCCESSFUL";
    }

    function startTimer() {
        setInterval(() => {
            timer--;
            let percent = (timer / 30) * 100;
            document.getElementById('progress').style.width = (100 - percent) + "%";
            
            if (timer <= 0) {
                timer = 30;
                updateUI();
            }
        }, 1000);
    }

    function forceSync() {
        timer = 1;
        document.getElementById('sync-status').innerText = "RE-ANALYZING PATTERN...";
    }

    // Initialize
    updateUI();
    startTimer();
</script>

</body>
</html>
